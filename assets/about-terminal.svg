<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Felicia Tan portfolio terminal introduction</title>
  <desc id="desc">A white terminal window with black borders, purple prompts, introduction text, and a blinking cursor.</desc>

  <!-- Drop shadow -->
  <rect x="18" y="18" width="884" height="404" rx="18" fill="#000000"/>

  <!-- Terminal body -->
  <rect x="8" y="8" width="884" height="404" rx="18" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Header -->
  <path d="M26 8H874A18 18 0 0 1 892 26V72H8V26A18 18 0 0 1 26 8Z" fill="#f1f1f1"/>
  <line x1="8" y1="72" x2="892" y2="72" stroke="#000000" stroke-width="4"/>

  <!-- Window controls -->
  <circle cx="42" cy="40" r="11" fill="#ff5f56" stroke="#000000" stroke-width="2"/>
  <circle cx="78" cy="40" r="11" fill="#ffbd2e" stroke="#000000" stroke-width="2"/>
  <circle cx="114" cy="40" r="11" fill="#27c93f" stroke="#000000" stroke-width="2"/>

  <text x="854" y="45" text-anchor="end"
        font-family="Fira Code, Consolas, monospace"
        font-size="16" fill="#777777">bash — about.sh</text>

  <!-- Prompt 1 -->
  <text x="42" y="118"
        font-family="Fira Code, Consolas, monospace"
        font-size="20" font-weight="700" fill="#6366f1">felicia@portfolio:~$</text>
  <text x="286" y="118"
        font-family="Fira Code, Consolas, monospace"
        font-size="20" fill="#222222">cat intro.txt</text>

  <!-- Intro -->
  <g font-family="Fira Code, Consolas, monospace" font-size="18" fill="#222222">
    <text x="42" y="164">I combine clean front-end code with UI/UX principles to</text>
    <text x="42" y="196">build accessible, user-centric digital products that look</text>
    <text x="42" y="228">good and work smoothly.</text>

    <text x="42" y="276">I enjoy turning ideas and technical requirements into</text>
    <text x="42" y="308">practical solutions through code, design and experimentation.</text>
  </g>

  <!-- Resume prompt -->
  <text x="42" y="354"
        font-family="Fira Code, Consolas, monospace"
        font-size="20" font-weight="700" fill="#6366f1">felicia@portfolio:~$</text>
  <text x="286" y="354"
        font-family="Fira Code, Consolas, monospace"
        font-size="20" text-decoration="underline" fill="#6366f1">./download_resume.sh</text>

  <!-- Final prompt + blinking cursor -->
  <text x="42" y="392"
        font-family="Fira Code, Consolas, monospace"
        font-size="20" font-weight="700" fill="#6366f1">felicia@portfolio:~$</text>
  <text x="286" y="392"
        font-family="Fira Code, Consolas, monospace"
        font-size="22" font-weight="700" fill="#222222">_
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.4;0.5;0.9;1"
             dur="1.1s"
             repeatCount="indefinite"/>
  </text>
</svg>
