<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace" role="img" aria-label="Terminal window: Felicia Tan, Year 2 IT Student at Nanyang Polytechnic">
  <title>felicia@github — about.sh</title>

  <defs>
    <clipPath id="card">
      <rect x="3" y="3" width="778" height="380" rx="12"/>
    </clipPath>
    <clipPath id="nameClip">
      <rect x="34" y="98" width="0" height="42">
        <animate attributeName="width" from="0" to="360" begin="0.7s" dur="0.75s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Neo-brutalist hard shadow (brand purple) -->
  <rect x="11" y="11" width="778" height="380" rx="12" fill="#6366F1"/>

  <!-- Terminal card (GitHub-dark) -->
  <rect x="3" y="3" width="778" height="380" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <!-- Title bar -->
  <g clip-path="url(#card)">
    <rect x="3" y="3" width="778" height="44" fill="#161B22"/>
  </g>
  <line x1="3" y1="47" x2="781" y2="47" stroke="#30363D" stroke-width="2"/>
  <circle cx="32" cy="25" r="7" fill="#FF5F56"/>
  <circle cx="56" cy="25" r="7" fill="#FFBD2E"/>
  <circle cx="80" cy="25" r="7" fill="#27C93F"/>
  <text x="762" y="30" text-anchor="end" font-size="13" fill="#8B949E" opacity="0.75">bash — about.sh</text>

  <!-- $ whoami -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.35s" fill="freeze"/>
    <text x="34" y="90" font-size="15.5">
      <tspan fill="#818CF8" font-weight="700">felicia@github:~$</tspan><tspan fill="#E6EDF3"> whoami</tspan>
    </text>
  </g>

  <!-- Name (typing wipe) -->
  <text x="34" y="128" font-size="30" font-weight="700" fill="#818CF8" clip-path="url(#nameClip)">&lt;Felicia Tan /&gt;</text>

  <!-- Role -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.35s" fill="freeze"/>
    <text x="34" y="156" font-size="15" fill="#8B949E">Year 2 Information Technology Student @ Nanyang Polytechnic</text>
  </g>

  <!-- $ cat intro.txt -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.35s" fill="freeze"/>
    <text x="34" y="204" font-size="15.5">
      <tspan fill="#818CF8" font-weight="700">felicia@github:~$</tspan><tspan fill="#E6EDF3"> cat intro.txt</tspan>
    </text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.35s" fill="freeze"/>
    <text x="34" y="230" font-size="14" fill="#C9D1D9">Frontend developer blending clean code with UI/UX principles</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.15s" dur="0.35s" fill="freeze"/>
    <text x="34" y="252" font-size="14" fill="#C9D1D9">to build accessible, user-centred digital products.</text>
  </g>

  <!-- $ ls skills/ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.35s" fill="freeze"/>
    <text x="34" y="300" font-size="15.5">
      <tspan fill="#818CF8" font-weight="700">felicia@github:~$</tspan><tspan fill="#E6EDF3"> ls skills/</tspan>
    </text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.35s" fill="freeze"/>
    <text x="34" y="326" font-size="14" fill="#3FB950">html  css  js  ts  python  react  flask  figma  aws</text>
  </g>

  <!-- Prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.35s" fill="freeze"/>
    <text x="34" y="366" font-size="15.5">
      <tspan fill="#818CF8" font-weight="700">felicia@github:~$</tspan>
    </text>
    <rect x="182" y="353" width="10" height="17" fill="#818CF8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
